[package]
name = "alpaca_markets"
description = "Unofficial Alpaca Markets (https://alpaca.markets) client library"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["finance"]
keywords = ["alpaca", "trading", "stocks", "finance"]
readme = "README.md"
repository = "https://github.com/IvanovOleg/alpaca_markets"

[features]
default = ["trading", "market_data"]
full = ["trading", "market_data", "websocket", "broker", "options"]

# Core features
trading = []
market_data = []
websocket = ["tokio-tungstenite", "futures-util", "rmp-serde"]

# Future features
broker = []
options = []

# Convenience features
rest_api = ["trading", "market_data"]
real_time = ["websocket"]

[dependencies]
# Core dependencies (always included)
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
thiserror = "2.0"

# Feature-specific dependencies
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"], optional = true }
futures-util = { version = "0.3", optional = true }
rmp-serde = { version = "1.3.0", optional = true }

[[example]]
name = "market_data"
path = "examples/market_data.rs"
required-features = ["market_data"]

[[example]]
name = "account_info"
path = "examples/account_info.rs"
required-features = ["trading"]

[[example]]
name = "trading_websocket"
path = "examples/trading_websocket.rs"
required-features = ["websocket"]

[[example]]
name = "market_data_websocket"
path = "examples/market_data_websocket.rs"
required-features = ["websocket"]
